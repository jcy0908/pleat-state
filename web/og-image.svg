  <title id="title">Pleat State — C++20 and WebAssembly material study</title>
  <desc id="description">A warm paper technical poster with a pleated line mesh, project title, and runtime labels.</desc>
  <rect width="1200" height="630" fill="#efeee9"/>
  <g fill="none" stroke="#181917">
