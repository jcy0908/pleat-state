    <text x="56" y="254" font-size="72" font-weight="600" letter-spacing="-4">A FOLD.</text>
    <text x="58" y="316" font-size="19" font-weight="500">A browser study of pleat, tension, damping and gravity.</text>
    <text x="58" y="354" font-family="SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.2">C++20 CORE  →  WEBASSEMBLY  →  CANVAS</text>
    <text x="56" y="561" font-family="SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.2">31 × 21 NODES</text>
    <text x="394" y="561" font-family="SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.2">FIXED 1/120 S</text>
    <text x="747" y="561" font-family="SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.2">LIVE MODEL / NOT MATERIAL CALIBRATION</text>
  </g>

